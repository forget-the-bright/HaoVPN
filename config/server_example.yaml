# 服务端配置参考示例（运行时由首次启动自动生成 server.yaml）
# 字段释义以 internal/config/defaults.go 模板注释为准；部署说明见 docs/deploy.md

server:
  listen: "0.0.0.0:8443"
  tls:
    cert_file: "./certs/server.crt"
    key_file: "./certs/server.key"
    auto_generate: true

vpn:
  subnet: "10.88.0.0/24"
  gateway_ip: "10.88.0.1"
  mtu: 1420
  heartbeat_interval_sec: 15
  heartbeat_timeout_sec: 90
  # 发送队列深度（帧条数）；默认 256。大文件/看电影可试 1024；范围 64～8192
  send_queue_size: 256
  session_policy: reject_second
  # 同公网 IP 短窗内重连顶替旧会话并续算流量（秒）；-1 关闭
  reconnect_grace_sec: 60

nat:
  enabled: true
  allowed_lan_cidrs:
    - "192.168.1.0/24"

database:
  path: "./data/haovpn.db"
  audit_retention_days: 90
  connection_events_retention_days: 90

api:
  listen_hosts: ["127.0.0.1"]
  # TUN 就绪后是否追加 VPN 网关 IP 到管理口（明文 HTTP）；false 则仅 listen_hosts
  listen_tun: true
  port: 8080
  allow_public_bind: false
  login_max_attempts: 5
  login_lockout_sec: 900
  session_ttl_sec: 28800
  # WebUI 展示时区（仅页面；SQLite/API 仍 UTC）。中国现场：Asia/Shanghai 或 GMT+8
  display_timezone: "UTC"

security:
  tunnel_allowed_source_ips: []
  enforce_split_tunnel: true
  # 仅兼容旧库明文私钥；生产保持 false
  allow_plaintext_private_keys: false
  # 允许全部 VPN 客户端互访对方虚拟 IP（默认 false；细粒度见控制台「托管路由」）
  allow_all_vpn_peers: false
  # 探针防御：见 docs/security-hardening.md（含特征中英文对照）
  # enabled:false 单独写即可关闭自动记录/自动封；封禁表仍生效（serverapp 始终挂 Probe）
  probe_defense:
    enabled: true                 # 自动记录/自动封
    record_events: true           # 写 security_events
    auto_ban: true                # 达阈值自动封禁
    ban_after_events: 8
    ban_window_sec: 600
    ban_duration_sec: 3600        # 0=永久
    event_retention_days: 30
    ignore_signatures_for_ban:    # 不计入自动封（仍记事件）
      - connection_reset
      - unexpected_eof
      - auth_failed
    ban_exempt_ips: []

admin:
  username: "admin"
  password: "changeme12"

log:
  level: "info"
  file: "./logs/server.log"
  max_size_mb: 100
  max_backups: 7
  history_retention_days: 90
  # history_db: "./data/logs.db"   # 留空则与 database 同目录
  # history_retention_days: -1   # 关闭结构化历史库
