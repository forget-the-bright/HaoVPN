<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探针防御 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><span class="logo-icon">VPN</span> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item active" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" onclick="HaoVPN.logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>探针防御</h1>
        <span class="text-muted">公网扫描事件与 IP 封禁</span>
      </header>
      <main class="content">
        <div class="card">
          <h2>当前封禁</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>手动封禁 IP</label>
              <input id="banIP" placeholder="x.x.x.x">
            </div>
            <div class="form-group">
              <label>原因</label>
              <input id="banReason" placeholder="可选">
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="banIP()">封禁</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="loadBlocks()">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>IP</th><th>来源</th><th>原因</th><th>特征</th><th>命中</th><th>过期</th><th></th></tr>
              </thead>
              <tbody id="blocks"></tbody>
            </table>
          </div>
        </div>

        <div class="card" style="margin-top:1rem">
          <h2>安全事件</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>IP</label>
              <input id="fIP" placeholder="筛选 IP">
            </div>
            <div class="form-group">
              <label>特征</label>
              <input id="fSig" placeholder="如 http_get">
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="loadEvents(0)">查询</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>IP</th><th>端口</th><th>阶段</th><th>特征</th><th>动作</th></tr>
              </thead>
              <tbody id="events"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    HaoVPN.setActiveNav('security');
    var offset = 0;

    async function loadBlocks() {
      try {
        await HaoVPN.refreshCSRF();
        var data = await HaoVPN.api('/api/v1/security/blocks?limit=100');
        var rows = data.items || [];
        var tb = document.getElementById('blocks');
        tb.innerHTML = '';
        if (!rows.length) {
          tb.innerHTML = '<tr><td colspan="7" class="text-muted">无生效封禁</td></tr>';
          return;
        }
        rows.forEach(function (b) {
          var tr = document.createElement('tr');
          var sig = b.signature_zh && b.signature
            ? (b.signature_zh + ' (' + b.signature + ')')
            : (b.signature_zh || b.signature || '');
          tr.innerHTML =
            '<td class="text-mono">' + (b.ip || '') + '</td>' +
            '<td>' + (b.source || '') + '</td>' +
            '<td>' + (b.reason || '') + '</td>' +
            '<td>' + sig + '</td>' +
            '<td>' + (b.hits || 0) + '</td>' +
            '<td class="text-mono">' + (b.expires_at || '永久') + '</td>' +
            '<td><button type="button" class="btn btn-ghost btn-sm" data-ip="' + b.ip + '">解封</button></td>';
          tr.querySelector('button').onclick = function () { unban(b.ip); };
          tb.appendChild(tr);
        });
      } catch (e) {
        alert(e.message || e);
      }
    }

    async function banIP() {
      var ip = document.getElementById('banIP').value.trim();
      if (!ip) { alert('请填写 IP'); return; }
      try {
        await HaoVPN.refreshCSRF();
        await HaoVPN.api('/api/v1/security/blocks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: ip, reason: document.getElementById('banReason').value.trim() })
        });
        document.getElementById('banIP').value = '';
        loadBlocks();
      } catch (e) {
        alert(e.message || e);
      }
    }

    async function unban(ip) {
      if (!confirm('解封 ' + ip + '？')) return;
      try {
        await HaoVPN.refreshCSRF();
        await HaoVPN.api('/api/v1/security/blocks/' + encodeURIComponent(ip), { method: 'DELETE' });
        loadBlocks();
      } catch (e) {
        alert(e.message || e);
      }
    }

    async function loadEvents(off) {
      if (off !== undefined) offset = off;
      try {
        await HaoVPN.refreshCSRF();
        var q = HaoVPN.buildQuery({
          limit: 50,
          offset: offset,
          ip: document.getElementById('fIP').value.trim(),
          signature: document.getElementById('fSig').value.trim()
        });
        var data = await HaoVPN.api('/api/v1/security/events' + q);
        var rows = data.items || [];
        var tb = document.getElementById('events');
        tb.innerHTML = '';
        if (!rows.length) {
          tb.innerHTML = '<tr><td colspan="6" class="text-muted">无事件</td></tr>';
        }
        rows.forEach(function (e) {
          var tr = document.createElement('tr');
          var phase = e.phase_zh && e.phase ? (e.phase_zh + ' (' + e.phase + ')') : (e.phase_zh || e.phase || '');
          var sig = e.signature_zh && e.signature
            ? (e.signature_zh + ' (' + e.signature + ')')
            : (e.signature_zh || e.signature || '');
          var act = e.action_zh && e.action ? (e.action_zh + ' (' + e.action + ')') : (e.action_zh || e.action || '');
          tr.innerHTML =
            '<td class="text-mono">' + (e.created_at || '') + '</td>' +
            '<td class="text-mono">' + (e.client_ip || '') + '</td>' +
            '<td class="text-mono">' + (e.client_port || '') + '</td>' +
            '<td>' + phase + '</td>' +
            '<td><span class="badge badge-ok">' + sig + '</span></td>' +
            '<td>' + act + '</td>';
          tb.appendChild(tr);
        });
        HaoVPN.renderPager(document.getElementById('pager'), data.total, 50, offset, loadEvents);
      } catch (e) {
        alert(e.message || e);
      }
    }

    loadBlocks();
    loadEvents(0);
  </script>
</body>
</html>
