<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探针防御 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><img class="logo-icon-img" src="/static/logo.png" alt="" width="36" height="36"> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item active" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" data-action="logout">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>探针防御</h1>
        <span class="text-muted">公网扫描事件与 IP 封禁</span>
      </header>
      <main class="content">
        <div class="card" id="banFormSection">
          <h2>当前封禁</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>手动封禁 IP</label>
              <input id="banIP" placeholder="x.x.x.x">
            </div>
            <div class="form-group">
              <label>原因</label>
              <input id="banReason" value="端口探测" placeholder="封禁原因">
            </div>
            <div class="form-group">
              <label>封禁时长</label>
              <select id="banDurationPreset">
                <option value="3600">1 小时</option>
                <option value="21600">6 小时</option>
                <option value="86400">1 天</option>
                <option value="259200">3 天</option>
                <option value="604800" selected>1 周</option>
                <option value="1209600">2 周</option>
                <option value="2592000">1 个月</option>
                <option value="7776000">3 个月</option>
                <option value="15552000">6 个月</option>
                <option value="31536000">1 年</option>
                <option value="63072000">2 年</option>
                <option value="157680000">5 年</option>
                <option value="0">永久</option>
                <option value="custom">自定义</option>
              </select>
            </div>
            <div class="form-group hidden" id="banCustomWrap">
              <label>自定义时长</label>
              <div class="inline-fields">
                <input id="banCustomValue" type="number" min="1" value="7" placeholder="数量">
                <select id="banCustomUnit">
                  <option value="60">分钟</option>
                  <option value="3600">小时</option>
                  <option value="86400" selected>天</option>
                  <option value="604800">周</option>
                  <option value="2592000">月（30 天）</option>
                  <option value="31536000">年（365 天）</option>
                </select>
              </div>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnBanIP">封禁</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshBlocks">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>IP</th><th>来源</th><th>原因</th><th>特征</th><th>命中</th><th>封禁时间</th><th>过期</th><th></th></tr>
              </thead>
              <tbody id="blocks"></tbody>
            </table>
          </div>
        </div>

        <div class="card mt-1" id="exemptSection">
          <h2>封禁豁免</h2>
          <p class="text-muted card-hint">列表内 IP/CIDR 永不自动或手动封禁，且不受已有封禁记录影响。可与 server.yaml 的 ban_exempt_ips 合并。</p>
          <div class="toolbar">
            <div class="form-group">
              <label>豁免 IP / CIDR</label>
              <input id="exemptIP" placeholder="x.x.x.x 或 203.0.113.0/24">
            </div>
            <div class="form-group">
              <label>备注</label>
              <input id="exemptNote" placeholder="如：办公室出口">
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnAddExempt">添加</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshExempts">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>IP / CIDR</th><th>备注</th><th>来源</th><th>添加时间</th><th></th></tr>
              </thead>
              <tbody id="exempts"></tbody>
            </table>
          </div>
        </div>

        <div class="card mt-1">
          <h2>安全事件</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>IP</label>
              <input id="fIP" placeholder="筛选 IP">
            </div>
            <div class="form-group">
              <label>特征</label>
              <input id="fSig" placeholder="如 http_get">
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnQueryEvents">查询</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>IP</th><th>端口</th><th>阶段</th><th>特征</th><th>动作</th><th></th></tr>
              </thead>
              <tbody id="events"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/security_probe.js"></script>
</body>
</html>
