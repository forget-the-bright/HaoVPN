<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审计日志 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><span class="logo-icon">VPN</span> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item active" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" onclick="HaoVPN.logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>审计日志</h1>
        <span class="text-muted">超期记录由服务端按保留策略自动清理</span>
      </header>
      <main class="content">
        <div class="card">
          <div class="toolbar">
            <div class="form-group">
              <label>动作</label>
              <input id="fAction" placeholder="英文码，如 login、account_create">
            </div>
            <div class="form-group">
              <label>每页</label>
              <select id="fLimit">
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="load(0)">查询</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>动作</th><th>目标</th><th>来源 IP</th></tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    HaoVPN.setActiveNav('audit');
    var offset = 0;

    async function load(off) {
      if (off !== undefined) offset = off;
      try {
        await HaoVPN.refreshCSRF();
        var limit = parseInt(document.getElementById('fLimit').value, 10) || 50;
        var q = HaoVPN.buildQuery({
          limit: limit,
          offset: offset,
          action: document.getElementById('fAction').value.trim()
        });
        var data = await HaoVPN.api('/api/v1/audit' + q);
        var rows = data.items || [];
        var tb = document.getElementById('list');
        tb.innerHTML = '';
        if (!rows.length) {
          tb.innerHTML = '<tr><td colspan="4" class="text-muted">无记录</td></tr>';
        }
        rows.forEach(function (e) {
          var tr = document.createElement('tr');
          var actionLabel = e.action || '';
          if (e.action_zh) {
            actionLabel = actionLabel + '（' + e.action_zh + '）';
          }
          var target = formatAuditTarget(e);
          var ts = e.created_at || '';
          if (typeof ts === 'string' && ts.indexOf('T') === -1 && ts.length > 10) {
            ts = ts.replace(' ', 'T') + 'Z';
          }
          tr.innerHTML =
            '<td class="text-mono">' + ts + '</td>' +
            '<td><span class="badge badge-ok">' + actionLabel + '</span></td>' +
            '<td>' + target + '</td>' +
            '<td class="text-mono">' + (e.client_ip || '') + '</td>';
          tb.appendChild(tr);
        });
        HaoVPN.renderPager(document.getElementById('pager'), data.total, limit, offset, load);
      } catch (ex) {
        HaoVPN.toast(ex.message, 'error');
      }
    }

    /** 目标列：用户 →「用户名 (#id)」；其它 →「中文类型」[+ #id] */
    function formatAuditTarget(e) {
      var typeZH = e.target_type_zh || e.target_type || '';
      var id = e.target_id;
      if (e.target_type === 'user') {
        if (e.target_username && id != null) {
          return e.target_username + ' (#' + id + ')';
        }
        if (e.target_username) {
          return e.target_username;
        }
        if (id != null) {
          return (typeZH || '用户') + ' (#' + id + ')';
        }
        return typeZH || '用户';
      }
      if (id != null && id !== '') {
        return (typeZH || e.target_type || '') + ' #' + id;
      }
      return typeZH || e.target_type || '';
    }

    document.getElementById('fAction').oninput = HaoVPN.debounce(function () { load(0); }, 400);
    load(0);
  </script>
</body>
</html>
