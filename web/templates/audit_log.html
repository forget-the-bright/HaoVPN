<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审计日志 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><img class="logo-icon-img" src="/static/logo.png" alt="" width="36" height="36"> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item active" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" data-action="logout">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>审计日志</h1>
        <span class="text-muted">超期记录由服务端按保留策略自动清理</span>
      </header>
      <main class="content">
        <div class="card">
          <div class="toolbar">
            <div class="form-group">
              <label>动作</label>
              <input id="fAction" placeholder="英文码，如 login、account_create">
            </div>
            <div class="form-group">
              <label>每页</label>
              <select id="fLimit">
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnQueryAudit">查询</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>动作</th><th>目标</th><th>来源 IP</th></tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/audit_log.js"></script>
</body>
</html>
