<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPN 账号 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><img class="logo-icon-img" src="/static/logo.png" alt="" width="36" height="36"> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item active" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" data-action="logout">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar"><h1>VPN 账号管理</h1></header>
      <main class="content">
        <div class="card">
          <h2 class="card-title">新建账号</h2>
          <p class="text-muted" style="margin-bottom:12px">
            fixed：可选手动 VPN IP（留空自动分配）。dynamic_*：连接时分配，不可指定固定 IP。策略由握手下发。
          </p>
          <form id="create" class="form-row">
            <div class="form-group">
              <label>用户名</label>
              <input name="username" required placeholder="engineer1">
            </div>
            <div class="form-group">
              <label>密码</label>
              <input name="password" type="password" required minlength="8">
            </div>
            <div class="form-group">
              <label>IP 模式</label>
              <select name="ip_mode" id="ip_mode">
                <option value="fixed" selected>固定 (fixed)</option>
                <option value="dynamic_session">会话动态 (dynamic_session)</option>
                <option value="dynamic_lease">租约动态 (dynamic_lease)</option>
              </select>
            </div>
            <div class="form-group" id="vpn_ip_group">
              <label>VPN IP（可选）</label>
              <input name="vpn_ip" id="create_vpn_ip" placeholder="留空则自动分配，如 10.88.0.50">
            </div>
            <div class="form-group" id="lease_group" style="display:none">
              <label>租约秒数</label>
              <input name="ip_lease_sec" type="number" value="86400" min="60">
            </div>
            <button type="submit" class="btn btn-primary">创建账号</button>
          </form>
        </div>

        <div class="card">
          <h2 class="card-title">账号列表</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>搜索</label>
              <input id="fQ" placeholder="用户名">
            </div>
            <div class="form-group">
              <label>状态</label>
              <select id="fEnabled">
                <option value="">全部</option>
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>
            <div class="form-group">
              <label>每页</label>
              <select id="fLimit">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th><th>用户名</th><th>VPN IP</th><th>IP 模式</th>
                  <th>策略版本</th><th>在线</th><th>状态</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="policyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center">
    <div class="card" style="width:min(480px,92vw);margin:auto">
      <h2 class="card-title">编辑 VPN 策略</h2>
      <p class="text-muted" id="policyHint"></p>
      <form id="policyForm">
        <input type="hidden" id="policyUserId">
        <div class="form-group">
          <label>AllowedIPs（每行一个 CIDR；空=用服务端默认）</label>
          <textarea id="policyAllowed" rows="4" placeholder="192.168.31.0/24"></textarea>
        </div>
        <div class="form-group">
          <label>IP 模式</label>
          <select id="policyIPMode">
            <option value="fixed">fixed</option>
            <option value="dynamic_session">dynamic_session</option>
            <option value="dynamic_lease">dynamic_lease</option>
          </select>
        </div>
        <div class="form-group" id="policyVpnIpGroup">
          <label>VPN IP（仅 fixed）</label>
          <input id="policyVpnIp" placeholder="10.88.0.50">
        </div>
        <div class="form-group" id="policyLeaseGroup">
          <label>租约秒数</label>
          <input id="policyLease" type="number" value="86400" min="60">
        </div>
        <div class="form-row" style="margin-top:12px">
          <button type="submit" class="btn btn-primary">保存并踢线重连</button>
          <button type="button" class="btn btn-ghost" id="btnClosePolicy">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="passwordModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center">
    <div class="card" style="width:min(420px,92vw);margin:auto">
      <h2 class="card-title">重置登录密码</h2>
      <p class="text-muted" id="passwordHint"></p>
      <form id="passwordForm">
        <input type="hidden" id="passwordUserId">
        <div class="form-group">
          <label>新密码（≥8 位）</label>
          <input id="passwordNew" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>确认新密码</label>
          <input id="passwordConfirm" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-row" style="margin-top:12px">
          <button type="submit" class="btn btn-primary">保存并踢线</button>
          <button type="button" class="btn btn-ghost" id="btnClosePassword">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/user_list.js"></script>
</body>
</html>
