<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body class="login-page">
  <div class="theme-switch login-theme-switch">
    <label for="themeSelect">主题</label>
    <select id="themeSelect" aria-label="主题">
      <option value="system">跟随系统</option>
      <option value="light">白天</option>
      <option value="dark">黑夜</option>
    </select>
  </div>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><img src="/static/logo.png" alt="HaoVPN" width="56" height="56"></div>
      <h1>HaoVPN 管理控制台</h1>
      <p>安全隧道 · 工控远程接入</p>
    </div>

    <div id="loginAlert" class="alert alert-warn hidden">首次登录须修改密码</div>
    <div id="loginError" class="alert alert-error hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input id="username" name="username" required autocomplete="username" placeholder="admin">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>

    <div id="changeBox" class="hidden login-change-box">
      <h2 class="login-change-title">设置新密码</h2>
      <form id="changeForm">
        <div class="form-group">
          <label for="old_password">当前密码</label>
          <input id="old_password" name="old_password" type="password" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="new_password">新密码（至少 8 位）</label>
          <input id="new_password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">保存并重新登录</button>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
