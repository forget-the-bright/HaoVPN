<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接详情 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><img class="logo-icon-img" src="/static/logo.png" alt="" width="36" height="36"> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item active" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <div class="theme-switch">
          <label for="themeSelect">主题</label>
          <select id="themeSelect" aria-label="主题">
            <option value="system">跟随系统</option>
            <option value="light">白天</option>
            <option value="dark">黑夜</option>
          </select>
        </div>
        <button type="button" class="btn btn-ghost btn-block btn-sm" data-action="logout">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>连接详情</h1>
        <span class="text-muted" id="pollHint">在线账号 10s 刷新</span>
      </header>
      <main class="content">
        <div class="card">
          <h2 class="card-title">账号会话</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>用户名</label>
              <input id="fQ" placeholder="筛选账号">
            </div>
            <div class="form-group">
              <label>状态</label>
              <select id="fOnline">
                <option value="">全部</option>
                <option value="1">仅在线</option>
              </select>
            </div>
            <div class="form-group form-group-limit">
              <label>每页</label>
              <select id="accLimit">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshAccounts">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>账号</th><th>VPN IP</th><th>状态</th><th>重连</th><th>会话分流前缀</th>
                  <th>连接时间</th><th>最后心跳</th><th>RX / TX</th><th>远端</th><th></th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
          <div class="pager" id="accPager"></div>
        </div>

        <div class="card mt-1">
          <div class="card-title-row">
            <h2 class="card-title card-title-inline">流量明细（L4）</h2>
            <button type="button" class="btn btn-ghost btn-sm" id="btnToggleFlows">展开</button>
          </div>
          <p class="text-muted">服务端解密后五元组聚合（TCP/UDP/ICMP）；不含 HTTP/HTTPS 内容。折叠时不轮询。</p>
          <div id="flowsBody" class="hidden">
            <div class="toolbar">
              <div class="form-group">
                <label>账号 ID</label>
                <input id="fFlowUser" placeholder="user_id，可空">
              </div>
              <div class="form-group">
                <label>客户端 IP</label>
                <input id="fFlowSrc" placeholder="子串，可空">
              </div>
              <div class="form-group">
                <label>远端 IP</label>
                <input id="fFlowDst" placeholder="子串，可空">
              </div>
              <div class="form-group">
                <label>协议</label>
                <select id="fFlowProto">
                  <option value="">全部</option>
                  <option value="6">TCP</option>
                  <option value="17">UDP</option>
                  <option value="1">ICMP</option>
                </select>
              </div>
              <div class="form-group form-group-limit">
                <label>每页</label>
                <select id="flowLimit">
                  <option value="20">20</option>
                  <option value="50" selected>50</option>
                  <option value="100">100</option>
                </select>
              </div>
              <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshFlows">刷新</button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>账号</th><th>客户端 IP</th><th>远端 IP</th><th>协议</th><th>端口</th>
                    <th class="th-sortable" data-sort="rx_bytes">RX <i class="sort-ind" aria-hidden="true"></i></th>
                    <th class="th-sortable" data-sort="tx_bytes">TX <i class="sort-ind" aria-hidden="true"></i></th>
                    <th class="th-sortable" data-sort="packets_in">入包 <i class="sort-ind" aria-hidden="true"></i></th>
                    <th class="th-sortable" data-sort="packets_out">出包 <i class="sort-ind" aria-hidden="true"></i></th>
                    <th class="th-sortable" data-sort="last_seen">最近活跃 <i class="sort-ind" aria-hidden="true"></i></th>
                  </tr>
                </thead>
                <tbody id="flowRows"></tbody>
              </table>
            </div>
            <div class="pager" id="flowPager"></div>
          </div>
        </div>

        <div class="card mt-1">
          <h2 class="card-title">连接事件</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>类型</label>
              <input id="fEvent" placeholder="connect / disconnect">
            </div>
            <div class="form-group form-group-limit">
              <label>每页</label>
              <select id="evLimit">
                <option value="20">20</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshConnEvents">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>账号</th><th>类型</th><th>远端</th></tr>
              </thead>
              <tbody id="events"></tbody>
            </table>
          </div>
          <div class="pager" id="evPager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/connection_detail.js"></script>
</body>
</html>
