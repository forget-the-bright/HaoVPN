<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接详情 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><span class="logo-icon">VPN</span> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item active" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" onclick="HaoVPN.logout()">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>连接详情</h1>
        <span class="text-muted" id="pollHint">在线账号 10s 刷新</span>
      </header>
      <main class="content">
        <div class="card">
          <h2 class="card-title">账号会话</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>用户名</label>
              <input id="fQ" placeholder="筛选账号">
            </div>
            <div class="form-group">
              <label>状态</label>
              <select id="fOnline">
                <option value="">全部</option>
                <option value="1">仅在线</option>
              </select>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="loadAccounts()">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>账号</th><th>VPN IP</th><th>状态</th><th>重连</th><th>AllowedIPs</th>
                  <th>连接时间</th><th>最后心跳</th><th>RX / TX</th><th>远端</th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">连接事件</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>类型</label>
              <input id="fEvent" placeholder="connect / disconnect">
            </div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="loadEvents(0)">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>账号</th><th>类型</th><th>远端</th></tr>
              </thead>
              <tbody id="events"></tbody>
            </table>
          </div>
          <div class="pager" id="evPager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    HaoVPN.setActiveNav('connections');
    var evOffset = 0;
    var rowCache = {};

    function renderAccountRow(p) {
      var key = String(p.user_id);
      var html =
        '<td>' + (p.username || p.user_id) + '</td>' +
        '<td class="text-mono">' + (p.vpn_ip || '') + '</td>' +
        '<td>' + (p.online ? HaoVPN.statusBadge(true, '在线', '') : '<span class="badge badge-warn">离线</span>') + '</td>' +
        '<td class="text-mono">' + (p.reconnect_count != null ? p.reconnect_count : '—') + '</td>' +
        '<td class="text-mono">' + ((p.allowed_ips || []).join(', ') || '—') + '</td>' +
        '<td class="text-mono">' + (p.connected_at || '—') + '</td>' +
        '<td class="text-mono">' + (p.last_heartbeat || '—') + '</td>' +
        '<td class="text-mono">' + HaoVPN.formatBytes(p.rx_bytes) + ' / ' + HaoVPN.formatBytes(p.tx_bytes) + '</td>' +
        '<td class="text-mono">' + (p.remote_addr || '') + '</td>';
      var tr = rowCache[key];
      if (!tr) {
        tr = document.createElement('tr');
        tr.dataset.key = key;
        rowCache[key] = tr;
      }
      if (tr.innerHTML !== html) tr.innerHTML = html;
      return tr;
    }

    async function loadAccounts() {
      await HaoVPN.refreshCSRF();
      var q = HaoVPN.buildQuery({
        q: document.getElementById('fQ').value.trim(),
        online: document.getElementById('fOnline').value
      });
      var all = await HaoVPN.api('/api/v1/monitor/accounts' + q);
      var tb = document.getElementById('list');
      var items = all.items || [];
      var seen = {};
      items.forEach(function (p) {
        seen[String(p.user_id)] = true;
        var tr = renderAccountRow(p);
        if (tr.parentNode !== tb) tb.appendChild(tr);
      });
      Array.from(tb.children).forEach(function (tr) {
        if (!seen[tr.dataset.key]) tr.remove();
      });
      if (!items.length) {
        tb.innerHTML = '<tr><td colspan="9" class="text-muted">无匹配账号</td></tr>';
        rowCache = {};
      }
    }

    async function loadEvents(off) {
      if (off !== undefined) evOffset = off;
      await HaoVPN.refreshCSRF();
      var q = HaoVPN.buildQuery({
        limit: 50,
        offset: evOffset,
        event_type: document.getElementById('fEvent').value.trim()
      });
      var ev = await HaoVPN.api('/api/v1/monitor/events' + q);
      var tb = document.getElementById('events');
      tb.innerHTML = '';
      (ev.items || []).forEach(function (e) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="text-mono">' + (e.created_at || '') + '</td>' +
          '<td>' + (e.username || e.user_id) + '</td>' +
          '<td><span class="badge badge-ok">' + (e.event_type || '') + '</span></td>' +
          '<td class="text-mono">' + (e.remote_addr || '') + '</td>';
        tb.appendChild(tr);
      });
      if (!(ev.items || []).length) {
        tb.innerHTML = '<tr><td colspan="4" class="text-muted">无事件</td></tr>';
      }
      HaoVPN.renderPager(document.getElementById('evPager'), ev.total, 50, evOffset, loadEvents);
    }

    async function load() {
      try {
        await loadAccounts();
        await loadEvents(evOffset);
      } catch (ex) {
        HaoVPN.toast(ex.message, 'error');
      }
    }

    document.getElementById('fQ').oninput = HaoVPN.debounce(loadAccounts, 400);
    document.getElementById('fOnline').onchange = loadAccounts;
    document.getElementById('fEvent').oninput = HaoVPN.debounce(function () { loadEvents(0); }, 400);

    load();
    setInterval(loadAccounts, 10000);
    setInterval(function () { loadEvents(evOffset); }, 30000);
  </script>
</body>
</html>
