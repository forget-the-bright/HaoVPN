<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接详情 · HaoVPN</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-sm"><img class="logo-icon-img" src="/static/logo.png" alt="" width="36" height="36"> HaoVPN</div>
        <div class="sub">管理控制台</div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" data-page="dashboard" href="/"><span class="icon">◉</span> 总览</a>
        <a class="nav-item" data-page="users" href="/users"><span class="icon">👤</span> 账号</a>
        <a class="nav-item" data-page="peers" href="/peers"><span class="icon">⇄</span> 托管路由</a>
        <a class="nav-item active" data-page="connections" href="/connections"><span class="icon">📡</span> 连接</a>
        <a class="nav-item" data-page="audit" href="/audit"><span class="icon">📋</span> 审计</a>
        <a class="nav-item" data-page="security" href="/security"><span class="icon">🛡</span> 探针</a>
        <a class="nav-item" data-page="tools" href="/tools"><span class="icon">🛠</span> 维护</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-block btn-sm" data-action="logout">退出登录</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1>连接详情</h1>
        <span class="text-muted" id="pollHint">在线账号 10s 刷新</span>
      </header>
      <main class="content">
        <div class="card">
          <h2 class="card-title">账号会话</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>用户名</label>
              <input id="fQ" placeholder="筛选账号">
            </div>
            <div class="form-group">
              <label>状态</label>
              <select id="fOnline">
                <option value="">全部</option>
                <option value="1">仅在线</option>
              </select>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshAccounts">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>账号</th><th>VPN IP</th><th>状态</th><th>重连</th><th>会话分流前缀</th>
                  <th>连接时间</th><th>最后心跳</th><th>RX / TX</th><th>远端</th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">连接事件</h2>
          <div class="toolbar">
            <div class="form-group">
              <label>类型</label>
              <input id="fEvent" placeholder="connect / disconnect">
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="btnRefreshConnEvents">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>时间</th><th>账号</th><th>类型</th><th>远端</th></tr>
              </thead>
              <tbody id="events"></tbody>
            </table>
          </div>
          <div class="pager" id="evPager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/connection_detail.js"></script>
</body>
</html>
